name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  schedule:
    - cron: "3 3 * * 2" # 3:03 AM, every Tuesday

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Mise tools
        uses: jdx/mise-action@v3

      - name: SwiftFormat Lint
        run: mise exec -- swiftformat --lint . --reporter github-actions-log

  apple:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.title, '[skip ci]')
    name: ${{ matrix.platform }} (Swift ${{ matrix.swift }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform:
          - iOS
          - mac-catalyst
          - macOS
          - tvOS
          - visionOS
          - watchOS
        swift:
          - "6.2"
          - "6.3"
    steps:
      - name: Git Checkout
        uses: actions/checkout@v5

      - name: Select Xcode version
        uses: mxcl/xcodebuild@v3
        with:
          swift: ~${{ matrix.swift }}
          action: none
          verbosity: xcbeautify

      - name: Disable SwiftSyntax Prebuilts
        run: |
          defaults write com.apple.dt.Xcode IDEPackageEnablePrebuilts -bool NO
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Developer/Xcode/SourcePackages
          rm -rf ~/Library/Caches/org.swift.swiftpm

      - if: ${{ matrix.platform != 'macOS' && matrix.platform != 'mac-catalyst' }}
        name: Initialize Simulator Service
        run: xcrun simctl list

      - if: ${{ matrix.platform != 'macOS' && matrix.platform != 'mac-catalyst' }}
        name: Download Default Runtime
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: xcodebuild -downloadPlatform ${{ matrix.platform }}

      - name: Run Tests
        uses: mxcl/xcodebuild@v3
        with:
          platform: ${{ matrix.platform }}
          swift: ~${{ matrix.swift }}
          action: test
          scheme: swiftui-text-builder
          verbosity: xcbeautify

  check-swift-syntax-compatibility:
    name: Swift Syntax Compatibility Check
    runs-on: macos-26
    steps:
      - name: Git Checkout
        uses: actions/checkout@v5

      - name: Check Swift Syntax Compatibility
        uses: davdroman/swift-syntax-compatibility-check@v1
        with:
          run-tests: false
          major-versions-only: true
          disable-prebuilts: true
